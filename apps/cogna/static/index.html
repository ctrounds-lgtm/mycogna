<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MyCogna</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --cream: #F9F5EF;
      --ink: #1C1A17;
      --gold: #C9963A;
      --gold-pale: #F7F0E3;
      --gold-light: #EDD9A8;
      --border: rgba(28,26,23,0.12);
    }

    html, body {
      height: 100%;
      background: var(--cream);
      color: var(--ink);
      font-family: 'DM Sans', sans-serif;
    }

    /* Ambient blobs */
    .blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.25;
      pointer-events: none;
      z-index: 0;
    }
    .blob-1 { width: 500px; height: 500px; background: #C9963A; top: -120px; right: -100px; }
    .blob-2 { width: 400px; height: 400px; background: #3A7B72; bottom: -80px; left: -80px; }

    .page {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px 24px;
      text-align: center;
    }

    .eyebrow {
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 20px;
    }

    .headline {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(36px, 8vw, 64px);
      font-weight: 300;
      line-height: 1.05;
      color: var(--ink);
      margin-bottom: 20px;
      max-width: 600px;
    }

    .headline em {
      font-style: italic;
      color: var(--gold);
    }

    .tagline {
      font-size: clamp(14px, 2.5vw, 17px);
      line-height: 1.65;
      color: rgba(28,26,23,0.55);
      max-width: 440px;
      margin-bottom: 48px;
    }

    .cta-group {
      display: flex;
      flex-direction: column;
      gap: 14px;
      width: 100%;
      max-width: 340px;
    }

    .cta-primary {
      display: block;
      width: 100%;
      padding: 16px 24px;
      background: var(--ink);
      color: white;
      border: none;
      border-radius: 6px;
      font-family: 'DM Sans', sans-serif;
      font-size: 16px;
      font-weight: 500;
      text-decoration: none;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.15s;
      text-align: center;
    }

    .cta-primary:hover { opacity: 0.88; transform: translateY(-1px); }

    .cta-secondary {
      display: block;
      width: 100%;
      padding: 15px 24px;
      background: transparent;
      color: var(--ink);
      border: 1.5px solid var(--border);
      border-radius: 6px;
      font-family: 'DM Sans', sans-serif;
      font-size: 16px;
      font-weight: 400;
      text-decoration: none;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      text-align: center;
    }

    .cta-secondary:hover { border-color: var(--gold); background: var(--gold-pale); }

    .companion-link {
      margin-top: 36px;
      font-size: 12px;
      color: rgba(28,26,23,0.35);
    }

    .companion-link a {
      color: rgba(28,26,23,0.35);
      text-decoration: none;
      border-bottom: 1px solid rgba(28,26,23,0.15);
      transition: color 0.2s, border-color 0.2s;
    }

    .companion-link a:hover { color: var(--gold); border-color: var(--gold); }

    .divider-row {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      color: rgba(28,26,23,0.25);
      font-size: 12px;
    }

    .divider-row::before, .divider-row::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }
  </style>
</head>
<body>
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>

  <div class="page">
    <div class="eyebrow">MyCogna</div>

    <h1 class="headline">Every story<br><em>deserves to be heard</em></h1>

    <p class="tagline">
      Capture the stories that matter before they fade.
      Record your voice, share your memory — preserved for the people who love you most.
    </p>

    <div class="cta-group">
      <a href="/storyteller" class="cta-primary">Record Your Story →</a>

      <div class="divider-row">or</div>

      <a href="/portal" class="cta-secondary">Collaborator Login</a>
    </div>

    <p class="companion-link">
      Looking for your voice companions? <a href="/companion">Enter your access code here.</a>
    </p>
  </div>
</body>
</html>
