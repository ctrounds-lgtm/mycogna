<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — MyCogna</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --cream: #F9F5EF;
      --ink: #1C1A17;
      --ink-muted: rgba(28,26,23,0.55);
      --ink-faint: rgba(28,26,23,0.35);
      --gold: #C9963A;
      --gold-pale: #F7F0E3;
      --gold-light: #EDD9A8;
      --teal: #3A7B72;
      --border: rgba(28,26,23,0.12);
      --error: #C45E4A;
    }

    html, body {
      min-height: 100%;
      background: var(--cream);
      color: var(--ink);
      font-family: 'DM Sans', sans-serif;
    }

    .blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(100px);
      opacity: 0.18;
      pointer-events: none;
      z-index: 0;
    }
    .blob-1 { width: 480px; height: 480px; background: var(--gold); top: -100px; right: -80px; }
    .blob-2 { width: 360px; height: 360px; background: var(--teal); bottom: -60px; left: -60px; }

    .page {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px 24px 80px;
    }

    .inner {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .wordmark {
      text-decoration: none;
      margin-bottom: 40px;
      display: block;
    }
    .wordmark img { height: 60px; display: block; margin: 0 auto; }

    .card {
      width: 100%;
      background: rgba(255,255,255,0.55);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 40px 36px;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .card-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 28px;
      font-weight: 400;
      line-height: 1.25;
      margin-bottom: 6px;
      text-align: center;
    }

    .card-sub {
      font-size: 14px;
      color: var(--ink-muted);
      text-align: center;
      margin-bottom: 28px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 16px;
    }

    label {
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--ink-muted);
    }

    input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: rgba(255,255,255,0.7);
      color: var(--ink);
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus { border-color: var(--gold); }

    .forgot-row {
      text-align: right;
      margin-top: -10px;
      margin-bottom: 20px;
    }

    .link-sm {
      font-size: 13px;
      color: var(--ink-muted);
      text-decoration: none;
      cursor: pointer;
      background: none;
      border: none;
      padding: 0;
      font-family: 'DM Sans', sans-serif;
    }
    .link-sm:hover { color: var(--ink); text-decoration: underline; }

    .btn-primary {
      width: 100%;
      padding: 14px;
      background: var(--ink);
      color: white;
      border: none;
      border-radius: 8px;
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.2s;
      margin-top: 8px;
    }

    .btn-primary:hover { opacity: 0.82; }
    .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 24px 0;
      color: var(--ink-faint);
      font-size: 12px;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .link-row {
      text-align: center;
      font-size: 14px;
      color: var(--ink-muted);
    }

    .link-row a {
      color: var(--ink);
      font-weight: 500;
      text-decoration: none;
      border-bottom: 1px solid var(--gold-light);
      transition: border-color 0.2s;
    }

    .link-row a:hover { border-color: var(--gold); }

    .error-msg {
      background: rgba(196,94,74,0.08);
      border: 1px solid rgba(196,94,74,0.3);
      border-radius: 8px;
      color: var(--error);
      font-size: 13px;
      padding: 10px 14px;
      margin-bottom: 16px;
      display: none;
    }
    .error-msg.visible { display: block; }

    .success-msg {
      background: rgba(58,123,114,0.08);
      border: 1px solid rgba(58,123,114,0.3);
      border-radius: 8px;
      color: var(--teal);
      font-size: 13px;
      padding: 10px 14px;
      margin-bottom: 16px;
      display: none;
    }
    .success-msg.visible { display: block; }

    /* Reset form (shown in place of login form) */
    .panel { display: none; }
    .panel.active { display: block; }

    @media (max-width: 480px) {
      .card { padding: 28px 20px; }
    }
  </style>
</head>
<body>
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>

  <div class="page">
    <div class="inner">
      <a href="/" class="wordmark"><img src="/mycogna-logo.svg" alt="MyCogna" /></a>

      <div class="card">

        <!-- Login panel -->
        <div id="panelLogin" class="panel active">
          <div class="card-title">Welcome back</div>
          <div class="card-sub">Sign in to continue your story.</div>

          <div id="loginError" class="error-msg"></div>

          <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="field">
              <label for="email">Email address</label>
              <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" required />
            </div>

            <div class="field">
              <label for="password">Password</label>
              <input type="password" id="password" name="password" placeholder="Your password" autocomplete="current-password" required />
            </div>

            <div class="forgot-row">
              <button type="button" class="link-sm" onclick="showReset()">Forgot your password?</button>
            </div>

            <button type="submit" class="btn-primary" id="loginBtn">Sign in</button>
          </form>

          <div class="divider">or</div>

          <div class="link-row">Don't have an account? <a href="/signup">Sign up</a></div>
          <div class="link-row" style="margin-top:12px">Have a user code? <a href="/storyteller">Enter it here</a></div>
        </div>

        <!-- Password reset request panel -->
        <div id="panelReset" class="panel">
          <div class="card-title">Reset password</div>
          <div class="card-sub">We'll send you a link to reset your password.</div>

          <div id="resetError" class="error-msg"></div>
          <div id="resetSuccess" class="success-msg"></div>

          <form id="resetForm" onsubmit="handleReset(event)">
            <div class="field">
              <label for="resetEmail">Email address</label>
              <input type="email" id="resetEmail" name="resetEmail" placeholder="you@example.com" autocomplete="email" required />
            </div>
            <button type="submit" class="btn-primary" id="resetBtn">Send reset link</button>
          </form>

          <div class="divider">or</div>
          <div class="link-row"><button class="link-sm" onclick="showLogin()" style="font-size:14px;color:var(--ink);font-weight:500">← Back to sign in</button></div>
        </div>

        <!-- New password panel (arrived via email link) -->
        <div id="panelNewPassword" class="panel">
          <div class="card-title">Choose a new password</div>
          <div class="card-sub">Enter and confirm your new password below.</div>

          <div id="newPwError" class="error-msg"></div>
          <div id="newPwSuccess" class="success-msg"></div>

          <form id="newPwForm" onsubmit="handleNewPassword(event)">
            <div class="field">
              <label for="newPw">New password</label>
              <input type="password" id="newPw" name="newPw" placeholder="At least 8 characters" autocomplete="new-password" required minlength="8" />
            </div>
            <div class="field">
              <label for="confirmPw">Confirm password</label>
              <input type="password" id="confirmPw" name="confirmPw" placeholder="Same password again" autocomplete="new-password" required />
            </div>
            <input type="hidden" id="resetToken" value="" />
            <button type="submit" class="btn-primary" id="newPwBtn">Set new password</button>
          </form>
        </div>

        <!-- Choice panel — shown when user has both portal and storyteller access -->
        <div id="panelChoice" class="panel">
          <div class="card-title">Welcome back</div>
          <div class="card-sub">Where would you like to go?</div>
          <div style="display:flex;flex-direction:column;gap:12px;margin-top:8px">
            <button class="btn-primary" onclick="window.location.href='/storyteller'">
              Go to my stories →
            </button>
            <button class="btn-primary" style="background:transparent;color:var(--ink);border:1.5px solid var(--border)"
                    onclick="window.location.href='/portal'">
              Go to my portal →
            </button>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script>
    // Check for reset token in URL
    const params = new URLSearchParams(window.location.search);
    const resetToken = params.get('reset_token');
    if (resetToken) {
      document.getElementById('resetToken').value = resetToken;
      showPanel('panelNewPassword');
    }

    // Route user based on their role
    function routeByRole(user, token) {
      const role = user.role || 'storyteller';
      if (role === 'both' || role === 'portal_admin') {
        localStorage.setItem('portalToken', token);
        window.location.href = '/portal';
      } else {
        localStorage.setItem('st_token', token);
        localStorage.setItem('st_email', user.email);
        localStorage.setItem('st_first_name', user.first_name || '');
        window.location.href = '/storyteller';
      }
    }

    // If already logged in, redirect to the right destination
    if (!resetToken) {
      const portalToken = localStorage.getItem('portalToken');
      if (portalToken) {
        fetch('/api/auth/me', { headers: { Authorization: 'Bearer ' + portalToken } })
          .then(r => r.ok ? r.json() : null)
          .then(data => { if (data && data.user) routeByRole(data.user, portalToken); })
          .catch(() => {});
      } else {
        const stToken = localStorage.getItem('st_token');
        if (stToken) {
          fetch('/api/auth/me', { headers: { Authorization: 'Bearer ' + stToken } })
            .then(r => r.ok ? r.json() : null)
            .then(data => { if (data && data.user) routeByRole(data.user, stToken); })
            .catch(() => {});
        }
      }
    }

    function showPanel(id) {
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
      document.getElementById(id).classList.add('active');
    }

    function showLogin() { showPanel('panelLogin'); }
    function showReset() { showPanel('panelReset'); }

    async function handleLogin(e) {
      e.preventDefault();
      const errEl = document.getElementById('loginError');
      errEl.className = 'error-msg';

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const btn = document.getElementById('loginBtn');

      btn.disabled = true;
      btn.textContent = 'Signing in…';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password }),
        });
        const data = await res.json();

        if (!res.ok) {
          errEl.textContent = data.detail || 'Invalid email or password.';
          errEl.className = 'error-msg visible';
          btn.disabled = false;
          btn.textContent = 'Sign in';
          return;
        }

        routeByRole(data.user, data.token);
      } catch (err) {
        errEl.textContent = 'Network error. Please check your connection and try again.';
        errEl.className = 'error-msg visible';
        btn.disabled = false;
        btn.textContent = 'Sign in';
      }
    }

    async function handleReset(e) {
      e.preventDefault();
      const errEl = document.getElementById('resetError');
      const succEl = document.getElementById('resetSuccess');
      errEl.className = 'error-msg';
      succEl.className = 'success-msg';

      const email = document.getElementById('resetEmail').value.trim();
      const btn = document.getElementById('resetBtn');

      btn.disabled = true;
      btn.textContent = 'Sending…';

      try {
        await fetch('/api/auth/request-reset', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email }),
        });
        succEl.textContent = 'If that email has an account, a reset link is on its way. Check your inbox.';
        succEl.className = 'success-msg visible';
        btn.disabled = false;
        btn.textContent = 'Send reset link';
      } catch (err) {
        errEl.textContent = 'Network error. Please try again.';
        errEl.className = 'error-msg visible';
        btn.disabled = false;
        btn.textContent = 'Send reset link';
      }
    }

    async function handleNewPassword(e) {
      e.preventDefault();
      const errEl = document.getElementById('newPwError');
      const succEl = document.getElementById('newPwSuccess');
      errEl.className = 'error-msg';
      succEl.className = 'success-msg';

      const token = document.getElementById('resetToken').value;
      const password = document.getElementById('newPw').value;
      const confirm = document.getElementById('confirmPw').value;
      const btn = document.getElementById('newPwBtn');

      if (password !== confirm) {
        errEl.textContent = "Passwords don't match. Please try again.";
        errEl.className = 'error-msg visible';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Saving…';

      try {
        const res = await fetch('/api/auth/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, password }),
        });
        const data = await res.json();

        if (!res.ok) {
          errEl.textContent = data.detail || 'Something went wrong. Please try again.';
          errEl.className = 'error-msg visible';
          btn.disabled = false;
          btn.textContent = 'Set new password';
          return;
        }

        succEl.textContent = 'Password updated. Redirecting you to sign in…';
        succEl.className = 'success-msg visible';
        setTimeout(() => {
          window.history.replaceState({}, '', '/login');
          showLogin();
        }, 2000);
      } catch (err) {
        errEl.textContent = 'Network error. Please try again.';
        errEl.className = 'error-msg visible';
        btn.disabled = false;
        btn.textContent = 'Set new password';
      }
    }
  </script>
</body>
</html>
