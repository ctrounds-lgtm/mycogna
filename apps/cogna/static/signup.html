<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create an Account — MyCogna</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --cream: #F9F5EF;
      --ink: #1C1A17;
      --ink-muted: rgba(28,26,23,0.55);
      --ink-faint: rgba(28,26,23,0.35);
      --gold: #C9963A;
      --gold-pale: #F7F0E3;
      --gold-light: #EDD9A8;
      --teal: #3A7B72;
      --border: rgba(28,26,23,0.12);
      --error: #C45E4A;
    }

    html, body {
      min-height: 100%;
      background: var(--cream);
      color: var(--ink);
      font-family: 'DM Sans', sans-serif;
    }

    .blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(100px);
      opacity: 0.18;
      pointer-events: none;
      z-index: 0;
    }
    .blob-1 { width: 480px; height: 480px; background: var(--gold); top: -100px; right: -80px; }
    .blob-2 { width: 360px; height: 360px; background: var(--teal); bottom: -60px; left: -60px; }

    .page {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px 24px 80px;
    }

    .inner {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .wordmark {
      font-family: 'Cormorant Garamond', serif;
      font-size: 22px;
      font-weight: 400;
      letter-spacing: 0.04em;
      color: var(--ink);
      text-decoration: none;
      margin-bottom: 40px;
    }

    .card {
      width: 100%;
      background: rgba(255,255,255,0.55);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 40px 36px;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .card-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 28px;
      font-weight: 400;
      line-height: 1.25;
      margin-bottom: 6px;
      text-align: center;
    }

    .card-sub {
      font-size: 14px;
      color: var(--ink-muted);
      text-align: center;
      margin-bottom: 28px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 16px;
    }

    label {
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--ink-muted);
    }

    input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: rgba(255,255,255,0.7);
      color: var(--ink);
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus { border-color: var(--gold); }

    .optional-label {
      font-size: 11px;
      color: var(--ink-faint);
      font-style: italic;
      margin-left: 4px;
    }

    .code-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      background: var(--gold-pale);
      border: 1px solid var(--gold-light);
      border-radius: 20px;
      font-size: 12px;
      font-weight: 500;
      color: var(--gold);
      letter-spacing: 0.04em;
      margin-bottom: 20px;
    }

    .btn-primary {
      width: 100%;
      padding: 14px;
      background: var(--ink);
      color: white;
      border: none;
      border-radius: 8px;
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.2s;
      margin-top: 8px;
    }

    .btn-primary:hover { opacity: 0.82; }
    .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 24px 0;
      color: var(--ink-faint);
      font-size: 12px;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .link-row {
      text-align: center;
      font-size: 14px;
      color: var(--ink-muted);
    }

    .link-row a {
      color: var(--ink);
      font-weight: 500;
      text-decoration: none;
      border-bottom: 1px solid var(--gold-light);
      transition: border-color 0.2s;
    }

    .link-row a:hover { border-color: var(--gold); }

    .error-msg {
      background: rgba(196,94,74,0.08);
      border: 1px solid rgba(196,94,74,0.3);
      border-radius: 8px;
      color: var(--error);
      font-size: 13px;
      padding: 10px 14px;
      margin-bottom: 16px;
      display: none;
    }

    .error-msg.visible { display: block; }

    .success-msg {
      background: rgba(58,123,114,0.08);
      border: 1px solid rgba(58,123,114,0.3);
      border-radius: 8px;
      color: var(--teal);
      font-size: 13px;
      padding: 10px 14px;
      margin-bottom: 16px;
      display: none;
    }

    .success-msg.visible { display: block; }

    @media (max-width: 480px) {
      .card { padding: 28px 20px; }
    }
  </style>
</head>
<body>
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>

  <div class="page">
    <div class="inner">
      <a href="/" class="wordmark">MYCOGNA</a>

      <div class="card">
        <div class="card-title">Create your account</div>
        <div class="card-sub">Start preserving stories today.</div>

        <div id="codeBadge" class="code-badge" style="display:none">
          <span>&#10003;</span>
          <span id="codeText">Invite code applied</span>
        </div>

        <div id="errorMsg" class="error-msg"></div>

        <form id="signupForm" onsubmit="handleSignup(event)">
          <div class="field">
            <label for="firstName">First name</label>
            <input type="text" id="firstName" name="firstName" placeholder="Your first name" autocomplete="given-name" required />
          </div>

          <div class="field">
            <label for="lastName">Last name</label>
            <input type="text" id="lastName" name="lastName" placeholder="Your last name" autocomplete="family-name" required />
          </div>

          <div class="field">
            <label for="email">Email address</label>
            <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" required />
          </div>

          <div class="field">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="At least 8 characters" autocomplete="new-password" required minlength="8" />
          </div>

          <div class="field">
            <label for="confirm">Confirm password</label>
            <input type="password" id="confirm" name="confirm" placeholder="Same password again" autocomplete="new-password" required />
          </div>

          <div class="field">
            <label for="source">How did you hear about MyCogna? <span class="optional-label">optional</span></label>
            <input type="text" id="source" name="source" placeholder="e.g. a friend, social media, article…" autocomplete="off" />
          </div>

          <input type="hidden" id="userCode" name="userCode" value="" />

          <button type="submit" class="btn-primary" id="submitBtn">Create account</button>
        </form>

        <div class="divider">or</div>

        <div class="link-row">Already have an account? <a href="/login">Sign in</a></div>
      </div>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const codeParam = params.get('code') || '';
    const planParam = (params.get('plan') || '').toUpperCase();

    if (codeParam) {
      document.getElementById('userCode').value = codeParam.toUpperCase();
      const badge = document.getElementById('codeBadge');
      document.getElementById('codeText').textContent = `Invite code: ${codeParam.toUpperCase()}`;
      badge.style.display = 'inline-flex';
    }

    // If already logged in, redirect to storyteller
    const existingToken = localStorage.getItem('st_token');
    if (existingToken) {
      fetch('/api/storyteller/me', { headers: { Authorization: 'Bearer ' + existingToken } })
        .then(r => { if (r.ok) window.location.href = '/storyteller'; })
        .catch(() => {});
    }

    async function handleSignup(e) {
      e.preventDefault();
      const errEl = document.getElementById('errorMsg');
      errEl.className = 'error-msg';

      const firstName = document.getElementById('firstName').value.trim();
      const lastName = document.getElementById('lastName').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const confirm = document.getElementById('confirm').value;
      const userCode = document.getElementById('userCode').value.trim();
      const btn = document.getElementById('submitBtn');

      if (password !== confirm) {
        errEl.textContent = "Passwords don't match. Please try again.";
        errEl.className = 'error-msg visible';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Creating account…';

      try {
        const body = { first_name: firstName, last_name: lastName, email, password };
        if (userCode) body.user_code = userCode;
        if (planParam && !userCode) body.plan = planParam;

        const res = await fetch('/api/storyteller/signup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
        const data = await res.json();

        if (!res.ok) {
          errEl.textContent = data.detail || 'Something went wrong. Please try again.';
          errEl.className = 'error-msg visible';
          btn.disabled = false;
          btn.textContent = 'Create account';
          return;
        }

        localStorage.setItem('st_token', data.token);
        localStorage.setItem('st_email', data.user.email);
        localStorage.setItem('st_first_name', data.user.first_name || '');
        localStorage.setItem('st_last_name', data.user.last_name || '');

        window.location.href = '/storyteller';
      } catch (err) {
        errEl.textContent = 'Network error. Please check your connection and try again.';
        errEl.className = 'error-msg visible';
        btn.disabled = false;
        btn.textContent = 'Create account';
      }
    }
  </script>
</body>
</html>
